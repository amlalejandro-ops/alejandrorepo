<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pantalla de color</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition: background-color 0.3s;
      }
      .panel {
        background: rgba(255, 255, 255, 0.85);
        padding: 1.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        text-align: center;
        max-width: 90vw;
      }
      input {
        font-size: 1.2rem;
        padding: 0.5rem;
        width: 16rem;
        max-width: 100%;
        box-sizing: border-box;
      }
      #mensaje {
        margin: 0.75rem 0 0;
        min-height: 1.2em;
      }
      .error { color: #c00; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Escribe un color</h1>
      <input id="color" type="text" autocomplete="off" autofocus
             placeholder="rojo, blue, #ff8800, rgb(0,128,255)..." />
      <p id="mensaje">Pulsa Enter o simplemente escribe.</p>
    </div>

    <script>
      // Nombres en español -> nombres CSS
      const nombres = {
        rojo: "red", verde: "green", azul: "blue", amarillo: "yellow",
        naranja: "orange", morado: "purple", violeta: "violet", rosa: "pink",
        negro: "black", blanco: "white", gris: "gray", marron: "brown",
        "marrón": "brown", celeste: "skyblue", turquesa: "turquoise",
        dorado: "gold", plateado: "silver", granate: "maroon",
        cian: "cyan", magenta: "magenta", lima: "lime", "azul marino": "navy",
        beige: "beige", "verde oscuro": "darkgreen", "azul claro": "lightblue"
      };

      const input = document.getElementById("color");
      const mensaje = document.getElementById("mensaje");

      function aplicarColor() {
        const texto = input.value.trim().toLowerCase();
        if (!texto) return;

        let color = nombres[texto] || texto;
        // Permite escribir hex sin '#': ff0000 o f00
        if (/^([0-9a-f]{3}|[0-9a-f]{6})$/.test(color)) color = "#" + color;

        if (CSS.supports("color", color)) {
          document.body.style.backgroundColor = color;
          mensaje.textContent = "Color: " + color;
          mensaje.className = "";
        } else {
          mensaje.textContent = "\"" + input.value + "\" no es un color válido";
          mensaje.className = "error";
        }
      }

      input.addEventListener("input", aplicarColor);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") aplicarColor();
      });
    </script>
  </body>
</html>
